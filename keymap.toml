#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  # Open terminal in current dir
  { on = [ "o", "t" ], run = 'shell --orphan "$TERMINAL -e fish"', desc = "Open terminal in current directory" },

  # System copy/paste (URI list for Telegram/GUI apps, native duplicate handling in Yazi)
  { on = [ "y", "y" ], run = [ "yank", 'shell --confirm "printf \"file://%s\" \"$1\" | xclip -selection clipboard -t text/uri-list"' ], desc = "Yank file and copy URI to clipboard" },
  { on = [ "p", "p" ], run = 'shell --confirm "file=\$(xclip -o -selection clipboard -t text/uri-list 2>/dev/null | sed -e \"s|^file://||\" -e \"s|\r$||\"); if [ -n \"\$file\" ]; then cp -r \"\$file\" ./; else ya emit paste; fi"', desc = "Paste from clipboard or internal yank" },

  # Direct path copies to system clipboard
  { on = [ "c", "p" ], run = "copy path", desc = "Copy path to system clipboard" },
  { on = [ "c", "n" ], run = "copy filename", desc = "Copy filename" },

  # Image clipboard operations
  { on = [ "p", "i" ], run = 'shell --confirm "yazi-paste \"$PWD\""', desc = "Paste image from clipboard" },
  { on = [ "y", "i" ], run = 'shell --confirm "yazi-copy %s"', desc = "Copy image data to clipboard" },

  # Trash management
  { on = [ "d" ], run = "remove", desc = "Move to trash" },
  { on = [ "D" ], run = "remove --permanently", desc = "Permanently delete" },
  { on = [ "u" ], run = "shell 'trash-restore' --block --confirm", desc = "Restore trashed files interactively" },
  { on = [ "g", "t" ], run = "cd ~/.local/share/Trash/files", desc = "Go to trash" },

  # Drag & drop
  { on = "<C-y>", run = "shell --block -- yazi-drop", desc = "Drop files into current directory" },
  { on = "<C-d>", run = "shell -- dragon-drop -x -A -T %s", desc = "Drag selected files out" },

  # Plugins
  { on = "M", run = "plugin mount", desc = "Toggle mount" },
  { on = "<C-f>", run = "plugin yafg", desc = "Find text in files (yafg)" },

  # FZF integration
  { on = [ "F" ], run = "plugin fzf", desc = "FZF search files and directories" },
  { on = [ "<C-z>" ], run = "shell yazi-fzf-dir --block", desc = "Jump to directory via fzf" },

  # Compression & extraction
  { on = [ "c", "a", "a" ], run = "plugin --sync compress", desc = "Compress selected files" },
  { on = [ "c", "a", "p" ], run = "plugin compress -p", desc = "Archive selected files (password)" },
  { on = [ "c", "a", "l" ], run = "plugin compress -l", desc = "Archive selected files (compression level)" },

  # Quick navigation
  { on = [ "g", "w" ], run = "cd ~/Pictures/wallpapers", desc = "Go to Wallpapers" },
  { on = [ "g", "n" ], run = "cd ~/Documents/notes", desc = "Go to Notes" },
  { on = [ "g", "c" ], run = "cd ~/.config", desc = "Go to Config" },
  { on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to Downloads" },
  { on = [ "g", "p" ], run = "cd ~/Projects", desc = "Go to Projects" },
  { on = [ "g", "S" ], run = "cd ~/.config/suckflexibly/", desc = "Go to Suckflexibly" },
  { on = [ "g", "C" ], run = "cd ~/.config/mozilla/firefox/hkpo5rio.default-release/chrome", desc = "Go to UserChrome.css" },
  { on = [ "g", "y" ], run = "cd ~/.config/yazi", desc = "Go to Yazi" },
  { on = [ "g", "l" ], run = "cd ~/.local/bin/", desc = "Go to Scripts" },
]
